<section id="projects">
  <div class="content-wrapper">
    
    <div class="projects-grid">
      
      <div class="grid-item intro-box" data-aos="fade-up" data-aos-duration="600">
        <div class="intro-content">
          <h3 data-aos="fade-right" data-aos-delay="100">{{ introContent.subtitle | translate }}</h3>
          <div class="projects-title-container" data-aos="fade-up" data-aos-delay="200">
            <h2 class="projects-title">{{ introContent.title | translate }}</h2>
            <img
              class="underline aos-init aos-animate"
              src="/assets/img/00_Hand-drawn lines/03_Portfolio/Color option 3.webp"
              alt=""
              data-aos="zoom-in"
              data-aos-delay="300"
            />
          </div>
          <p data-aos="fade-up" data-aos-delay="400">{{ introContent.description | translate }}</p>
        </div>
      </div>

      @for (project of projects; track project.id; let i = $index) {
        <div class="grid-item project-box" 
             [attr.data-project-id]="project.id"
             data-aos="fade-up" 
             [attr.data-aos-delay]="(i * 150) + 500">
          <div class="project-image">
            
            <img [src]="project.image" [alt]="project.title" class="main-project-image">
            
            <div class="overlay"></div>
            <button class="my-button desktop-button" (click)="openProjectDetails(project.id)">
              {{ 'projects.button.details' | translate }}
            </button>
        
            @if (project.featured) {
              <div class="featured-badge-image">
                <img [src]="project.badgeImage" alt="Featured Project">
              </div>
            }
          </div>
          <div class="project-info">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <button class="my-button mobile-button" (click)="openProjectDetails(project.id)">
              {{ 'projects.button.details' | translate }}
            </button>
          </div>
        </div>
      }

    </div>
  </div>
</section>
