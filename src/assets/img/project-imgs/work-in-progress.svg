<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with gradient -->
  <defs>
    <linearGradient id="wipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="5" height="10" fill="#FFD700"/>
      <rect x="5" width="5" height="10" fill="#1a1a1a"/>
    </pattern>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="90" cy="90" r="85" fill="url(#wipGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Circle Border -->
  <circle cx="90" cy="90" r="78" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Construction Icon -->
  <g transform="translate(90, 70)">
    <!-- Warning Sign Triangle -->
    <path d="M 0 -22 L 26 22 L -26 22 Z" fill="url(#stripes)" stroke="#1a1a1a" stroke-width="2.5">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 0 0; -3 0 0; 3 0 0; 0 0 0" 
        dur="2s" 
        repeatCount="indefinite"/>
    </path>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
      !
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Text: Work in Progress -->
  <text x="90" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
    Work in
  </text>
  <text x="90" y="136" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
    Progress
  </text>
  
  <!-- Blinking warning lights -->
  <circle cx="90" cy="28" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="152" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Additional warning lights on sides -->
  <circle cx="30" cy="90" r="2.5" fill="#FFD700">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="90" r="2.5" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
</svg>
